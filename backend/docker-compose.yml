services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: heza
      POSTGRES_PASSWORD: heza
      POSTGRES_DB: heza
    ports:
      - "5433:5432"
    volumes:
      - heza_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  heza_db_data:
